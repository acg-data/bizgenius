ci:frontend-test:
  stage: checks
  image: node:20-bookworm
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "auto"
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "ci"
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH
      == "develop")
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $RECOVERED_WORKFLOW == "auto" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")
  - when: never
  script:
  - bash .gitlab/scripts/ci--frontend-test.sh
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
    - frontend/coverage/
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
  resource_group: ci-$CI_COMMIT_REF_SLUG
ci:build:
  stage: checks
  image: node:20-bookworm
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "auto"
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "ci"
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH
      == "develop")
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $RECOVERED_WORKFLOW == "auto" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")
  - when: never
  script:
  - bash .gitlab/scripts/ci--build.sh
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
    - frontend/dist
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
  resource_group: ci-$CI_COMMIT_REF_SLUG
  needs:
  - job: ci:frontend-test
    artifacts: true
    optional: true
ci:security:
  stage: checks
  image: node:20-bookworm
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "auto"
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "ci"
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH
      == "develop")
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $RECOVERED_WORKFLOW == "auto" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")
  - when: never
  script:
  - bash .gitlab/scripts/ci--security.sh
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
  resource_group: ci-$CI_COMMIT_REF_SLUG
