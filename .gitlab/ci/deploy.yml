deploy:build-images:
  stage: checks
  image: docker:27.5.1-cli
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "auto"
    when: manual
    allow_failure: true
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "deploy"
    when: manual
    allow_failure: true
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main")
    when: manual
    allow_failure: true
  - when: never
  script:
  - bash .gitlab/scripts/build-images.sh
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
    reports:
      dotenv: .ci-results/deploy--build-images.env
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  resource_group: deploy-$CI_COMMIT_REF_SLUG
  services:
  - name: docker:27.5.1-dind
    alias: docker
  before_script:
  - apk add --no-cache bash git
deploy:deploy-staging:
  stage: checks
  image: node:22-bookworm
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "deploy"
    when: manual
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main")
    when: manual
    allow_failure: true
  - when: never
  script:
  - bash .gitlab/scripts/deploy-digitalocean.sh staging
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
  resource_group: deploy-$CI_COMMIT_REF_SLUG
  needs:
  - job: deploy:build-images
    artifacts: true
    optional: true
  before_script:
  - apt-get update -qq && apt-get install -y -qq skopeo
deploy:deploy-production:
  stage: checks
  image: node:22-bookworm
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $RECOVERED_WORKFLOW == "deploy"
    when: manual
    allow_failure: false
  - if: $CI_PIPELINE_SOURCE == "push" && $RECOVERED_WORKFLOW == "auto" && ($CI_COMMIT_BRANCH == "main")
    when: manual
    allow_failure: true
  - when: never
  script:
  - bash .gitlab/scripts/deploy-digitalocean.sh production
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
    - .ci-results/
  timeout: 60 minutes
  variables:
    GIT_DEPTH: '0'
  resource_group: deploy-$CI_COMMIT_REF_SLUG
  needs:
  - job: deploy:build-images
    artifacts: true
    optional: true
  - job: deploy:deploy-staging
    artifacts: true
    optional: true
  before_script:
  - apt-get update -qq && apt-get install -y -qq skopeo
